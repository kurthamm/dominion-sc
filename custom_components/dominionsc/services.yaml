run_backfill:
  name: Run backfill
  description: Process one billing cycle backfill for Dominion SC totals.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:
    overwrite:
      name: Overwrite existing cycle
      description: Re-import selected cycle data and replace prior stored values.
      required: false
      default: false
      selector:
        boolean:

    allow_initialize_missing:
      name: Allow initialize missing cycles
      description: When true, the service may initialize the missing_cycles list when empty (used by automated runs). For manual calls, leave false to avoid implicit initialization.
      required: false
      default: false
      selector:
        boolean:

    cycle_key:
      name: Cycle key
      description: "Re-process one specific billing cycle as start|end (e.g. 2026-08-01|2026-08-31) instead of the next missing / first completed cycle. Combine with overwrite to replace stored values."
      required: false
      example: "2026-08-01|2026-08-31"
      selector:
        text:

rewrite_statistics:
  name: Rewrite statistics
  description: Clear legacy dominionsc external statistics so Energy Dashboard uses recorder sensor statistics only.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:
